name: legend2
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: tutor_dev
      POSTGRES_DB: tutor_copilot
      # Local synthetic development only; loopback port, no credentials to manage.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tutor_dev", "-d", "tutor_copilot"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://127.0.0.1:58080"]
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ./.highgrade/local/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_LOG_LEVEL: error
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - '{ printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&0; grep "HTTP/1.0 200"; } 0<>/dev/tcp/localhost/9000'
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
volumes:
  postgres-data:
